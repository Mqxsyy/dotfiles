[config.wallpaper]
command = "mpvpaper"
set = false

[templates.hyprland]
input_path = './templates/hyprland-colors.conf'
output_path = '~/.config/hypr/colors.conf'
post_hook = 'hyprctl reload'

[templates.kitty]
input_path = './templates/kitty-colors.conf'
output_path = '~/.config/kitty/colors.conf'
post_hook = 'for s in "$XDG_RUNTIME_DIR"/kitty-*; do kitty @ --to "unix:$s" set-colors -a -c ~/.config/kitty/colors.conf; done 2>/dev/null || true'

[templates.tmux]
input_path = './templates/colors.tmuxtheme'
output_path = '~/.config/tmux/colors.tmuxtheme'
post_hook = 'tmux source-file ~/.config/tmux/tmux.conf 2>/dev/null || true'

[templates.lualine]
input_path = './templates/nvim-lualine-colors.lua'
output_path = '~/.config/nvim/lua/nvim-lualine-colors.lua'

[templates.quickshell]
input_path = './templates/quickshell-colors.json'
output_path = '~/.local/state/quickshell/colors.json'
