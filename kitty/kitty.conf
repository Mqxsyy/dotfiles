include $HOME/.config/kitty/colors.conf

font_family FiraCode Nerd Font

# Remote control only through a socket (for matugen live colors), not escape codes
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}
background_opacity 0.85

# Animated cursor: slides to where it jumps (equal decays: no stretched trail)
cursor_trail 3
cursor_trail_decay 0.15 0.15
