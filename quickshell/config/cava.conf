# cava for the media panel's visualizer (components/Visualizer.qml): bar
# heights 0-100 as text on stdout, one frame per line, e.g. "12;40;33;...".

[general]
bars = 24
framerate = 60
# Rescale to the volume, so quiet and loud music both fill the bars.
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
# Higher is smoother and slower (0-100).
noise_reduction = 70
